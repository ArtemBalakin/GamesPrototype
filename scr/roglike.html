<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOID_OVERFLOW 3D</title>
    <style>
        :root {
            --bg: #050505;
            --green: #0f0;
            --dim-green: #004400;
            --red: #ff3333;
            --cyan: #00ffff;
            --gold: #ffcc00;
            --font: 'Courier New', monospace;
        }

        * {
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg);
            color: var(--green);
            font-family: var(--font);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            user-select: none;
            position: relative;
        }

        body::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%),
            linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 100;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        #game-wrapper {
            position: relative;
            width: 900px;
            max-width: 100vw;
            height: 620px;
            max-height: 100vh;
            border: 2px solid var(--green);
            box-shadow: 0 0 25px var(--dim-green);
            background: #000;
            display: grid;
            grid-template-rows: auto 1fr auto;
            z-index: 10;
        }

        #main-menu {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.95);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
            text-align: center;
        }

        .title-glitch {
            font-size: 3rem;
            font-weight: bold;
            text-shadow: 2px 2px var(--red), -2px -2px var(--cyan);
            animation: glitch-anim 2s infinite;
            margin-bottom: 2rem;
        }

        .start-btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            background: transparent;
            border: 2px solid var(--green);
            color: var(--green);
            font-family: var(--font);
            cursor: pointer;
            transition: 0.2s;
        }

        .start-btn:hover {
            background: var(--green);
            color: #000;
            box-shadow: 0 0 15px var(--green);
        }

        #hud {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            border-bottom: 1px solid var(--dim-green);
            font-size: 1.1rem;
            background: #020202;
        }

        #hud-right {
            display: flex;
            gap: 20px;
        }

        .danger {
            color: var(--red);
        }

        .warn {
            color: var(--gold);
        }

        #hint {
            position: absolute;
            top: 8px;
            right: 10px;
            font-size: 0.75rem;
            color: #777;
            z-index: 5;
        }

        #viewport {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #three-container {
            width: 100%;
            height: 100%;
        }

        #battle-overlay {
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            font-size: 0.9rem;
            pointer-events: none;
        }

        #entity-name {
            font-weight: bold;
            margin-bottom: 2px;
        }

        #entity-hp {
            color: var(--red);
        }

        #controls-area {
            border-top: 1px solid var(--dim-green);
            padding: 10px 15px;
            display: grid;
            grid-template-columns: 1fr 1.5fr;
            gap: 15px;
            background: #020202;
            height: 190px;
        }

        #inventory {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .item-slot {
            border: 1px dashed #444;
            padding: 5px;
            font-size: 0.8rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 60px;
        }

        .slot-weapon {
            border-color: var(--red);
        }

        .slot-utility {
            border-color: var(--cyan);
        }

        #action-panel {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        #action-buttons {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        button {
            background: #111;
            border: 1px solid var(--dim-green);
            color: var(--green);
            font-family: var(--font);
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.1s;
        }

        button:hover:not(:disabled) {
            border-color: var(--green);
            background: #222;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            border-color: #333;
            color: #555;
        }

        .btn-atk:hover {
            border-color: var(--red);
            color: var(--red);
        }

        .btn-heal:hover {
            border-color: var(--cyan);
            color: var(--cyan);
        }

        .btn-glitch {
            border-color: var(--red);
            color: var(--red);
        }

        .btn-glitch:hover {
            background: #300;
        }

        #combat-log {
            height: 70px;
            overflow-y: auto;
            font-size: 0.8rem;
            border: 1px solid #222;
            padding: 5px;
            display: flex;
            flex-direction: column-reverse;
        }

        #loot-panel {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 20, 0, 0.97);
            border: 1px solid var(--gold);
            padding: 20px;
            text-align: center;
            display: none;
            width: 300px;
            z-index: 25;
        }

        @keyframes glitch-anim {
            0% {
                transform: translate(0);
            }
            20% {
                transform: translate(-2px, 2px);
            }
            40% {
                transform: translate(-2px, -2px);
            }
            60% {
                transform: translate(2px, 2px);
            }
            80% {
                transform: translate(2px, -2px);
            }
            100% {
                transform: translate(0);
            }
        }
    </style>
</head>
<body>

<div id="game-wrapper">
    <div id="hint">WASD движение • Подойдите к врагу, чтобы начать бой • Дверь ведёт в следующий сектор</div>

    <div id="main-menu">
        <div class="title-glitch" id="menu-title">VOID_OVERFLOW</div>
        <div style="margin-bottom: 20px; color: #888;">СИСТЕМНЫЙ СБОЙ ОБНАРУЖЕН</div>
        <button class="start-btn" id="start-btn">ИНИЦИАЛИЗАЦИЯ</button>
    </div>

    <div id="hud">
        <div>ГЛУБИНА: <span id="ui-depth">0</span></div>
        <div id="hud-right">
            <div>HP: <span id="ui-hp">100</span>/<span id="ui-maxhp">100</span></div>
            <div>ЭНТРОПИЯ: <span id="ui-entropy" class="danger">0%</span></div>
        </div>
    </div>

    <div id="viewport">
        <div id="three-container"></div>

        <div id="battle-overlay">
            <div id="entity-name"></div>
            <div id="entity-hp"></div>
        </div>

        <div id="loot-panel">
            <h3 style="color:var(--gold)">НАЙДЕН МОДУЛЬ</h3>
            <div id="loot-desc" style="margin: 15px 0; font-size: 0.9rem;"></div>
            <div style="display:flex; gap:5px; justify-content: center; margin-bottom:5px;">
                <button onclick="Game.equipLoot(0)">В Слот 1</button>
                <button onclick="Game.equipLoot(1)">В Слот 2</button>
            </div>
            <button onclick="Game.discardLoot()" style="width:100%;">Разобрать (+Энтропия)</button>
        </div>
    </div>

    <div id="controls-area">
        <div id="inventory">
            <div id="slot-0" class="item-slot">ПУСТО</div>
            <div id="slot-1" class="item-slot">ПУСТО</div>
        </div>
        <div id="action-panel">
            <div id="action-buttons">
                <button id="btn-atk" class="btn-atk" onclick="Game.act('attack')">УДАР [ATK]</button>
                <button id="btn-heal" class="btn-heal" onclick="Game.act('heal')">ЛЕЧЕНИЕ [HP]</button>
                <button id="btn-glitch" class="btn-glitch" onclick="Game.act('glitch')">ГЛИТЧ (РИСК)</button>
            </div>
            <div id="combat-log"></div>
        </div>
    </div>
</div>

<script src="https://unpkg.com/three@0.158.0/build/three.min.js"></script>
<script>
    const ENEMIES = [
        {name: "NULL_DRONE", color: "#00ffff", hp: 30, dmg: 4},
        {name: "BLOCK_WALL", color: "#ffaa00", hp: 60, dmg: 6},
        {name: "TROJAN_VIRUS", color: "#ff3333", hp: 20, dmg: 10}
    ];

    const ITEM_TYPES = {
        WEAPON: {names: ["Клинок", "Бластер", "Лазер", "Деструктор"], type: "atk"},
        UTILITY: {names: ["Аптечка", "Пластырь", "Репайр-кит", "Бэкап"], type: "heal"}
    };

    const PREFIXES = [
        {text: "Ржавый", mul: 0.6},
        {text: "Обычный", mul: 1.0},
        {text: "Военный", mul: 1.4},
        {text: "Проклятый", mul: 2.0}
    ];

    let scene;
    let camera;
    let renderer;
    let playerMesh;
    let enemyMesh;
    let doorMesh;
    let roomGroup;
    let lastTime = 0;
    const keys = {};

    const Game = {
        state: {
            depth: 0,
            hp: 100,
            maxHp: 100,
            entropy: 0,
            inventory: [null, null],
            enemy: null,
            loot: null,
            phase: "menu",
            combat: false,
            over: false
        },
        world: {
            roomSize: 16,
            playerPos: {x: 0, z: 0},
            enemyPos: null,
            doorPos: null,
            lastDoorWarn: 0
        },

        resetState() {
            this.state.depth = 0;
            this.state.hp = 100;
            this.state.maxHp = 100;
            this.state.entropy = 0;
            this.state.inventory = [null, null];
            this.state.enemy = null;
            this.state.loot = null;
            this.state.phase = "explore";
            this.state.combat = false;
            this.state.over = false;
            this.world.playerPos = {x: 0, z: 0};
            this.world.enemyPos = null;
            this.world.doorPos = null;
            this.world.lastDoorWarn = 0;
            const logBox = document.getElementById("combat-log");
            logBox.innerHTML = "";
            document.getElementById("entity-name").innerText = "";
            document.getElementById("entity-hp").innerText = "";
            const panel = document.getElementById("loot-panel");
            panel.style.display = "none";
            if (enemyMesh && scene) {
                scene.remove(enemyMesh);
                enemyMesh = null;
            }
        },

        start() {
            document.getElementById("main-menu").style.display = "none";
            document.getElementById("menu-title").innerText = "VOID_OVERFLOW";
            document.getElementById("start-btn").innerText = "ИНИЦИАЛИЗАЦИЯ";
            this.resetState();
            this.state.phase = "explore";
            this.state.inventory[0] = this.createItem(0, "atk");
            this.state.inventory[1] = this.createItem(0, "heal");
            this.log("Система загружена.");
            this.renderInv();
            this.updateUI();
            this.nextLevel();
        },

        nextLevel() {
            if (this.state.over) return;
            this.state.depth += 1;
            const base = ENEMIES[Math.floor(Math.random() * ENEMIES.length)];
            const scale = 1 + this.state.depth * 0.15;
            this.state.enemy = {
                name: base.name,
                maxHp: Math.floor(base.hp * scale),
                hp: Math.floor(base.hp * scale),
                dmg: Math.floor(base.dmg * scale),
                color: base.color
            };
            this.state.phase = "explore";
            this.state.combat = false;
            this.state.loot = null;
            this.setupRoom();
            this.updateUI();
            this.log("Вход в сектор " + this.state.depth + ". Обнаружен " + this.state.enemy.name + ".");
        },

        setupRoom() {
            const size = this.world.roomSize;
            this.world.playerPos = {x: 0, z: size * 0.35};
            this.world.enemyPos = {x: 0, z: -size * 0.15};
            this.world.doorPos = {x: 0, z: -size * 0.45};
            rebuildRoom(size);
            placePlayerMesh(this.world.playerPos);
            spawnEnemyMesh(this.state.enemy, this.world.enemyPos);
            placeDoorMesh(this.world.doorPos, !this.state.enemy);
        },

        startCombat() {
            if (!this.state.enemy) return;
            if (this.state.phase === "combat") return;
            this.state.phase = "combat";
            this.state.combat = true;
            this.log("Контакт: " + this.state.enemy.name + ". Бой начат.");
            document.getElementById("entity-name").innerText = this.state.enemy.name;
            document.getElementById("entity-hp").innerText = "HP: " + this.state.enemy.hp + " / " + this.state.enemy.maxHp;
            this.updateUI();
        },

        hitDoor() {
            if (this.state.over) return;
            const now = performance.now();
            if (this.state.enemy) {
                if (now - this.world.lastDoorWarn > 800) {
                    this.log("Преграда не пропускает. Сектор ещё не зачищен.", "warn");
                    this.world.lastDoorWarn = now;
                }
                return;
            }
            this.log("Переход в следующий сектор.");
            this.nextLevel();
        },

        act(action) {
            if (this.state.phase !== "combat" || this.state.over || !this.state.enemy) return;

            let dmg = 0;
            let heal = 0;
            let cost = 5;

            let totalAtk = 0;
            let totalHeal = 0;

            this.state.inventory.forEach(item => {
                if (item) {
                    if (item.type === "atk") totalAtk += item.val;
                    if (item.type === "heal") totalHeal += item.val;
                }
            });

            let mul = 1;
            if (this.state.entropy > 50) mul += 0.5;
            if (this.state.entropy > 80) mul += 0.5;

            if (action === "attack") {
                if (totalAtk === 0) {
                    this.log("Нет оружия! Вы бьете кулаками (1 урон).", "danger");
                    dmg = 1;
                } else {
                    dmg = Math.floor(totalAtk * mul);
                }
                this.state.enemy.hp -= dmg;
                this.log("Атака нанесла " + dmg + " ед.");
                animEnemyHit();
            } else if (action === "heal") {
                if (totalHeal === 0) {
                    this.log("Нет аптечек! Лечение невозможно.", "danger");
                } else {
                    heal = Math.floor(totalHeal * mul);
                    this.state.hp = Math.min(this.state.maxHp, this.state.hp + heal);
                    cost = -15;
                    this.log("Восстановлено " + heal + " HP.");
                }
            } else if (action === "glitch") {
                cost = 20;
                const roll = Math.random();
                if (roll < 0.3) {
                    this.state.hp -= 15;
                    this.log("ГЛИТЧ: Ошибка! -15 HP", "danger");
                } else if (roll < 0.7) {
                    const baseAtk = totalAtk || 5;
                    const crit = Math.floor(baseAtk * 3);
                    this.state.enemy.hp -= crit;
                    this.log("ГЛИТЧ: Критический баг! " + crit + " урона.");
                    animEnemyHit();
                } else {
                    this.state.hp = this.state.maxHp;
                    this.log("ГЛИТЧ: Полный ресет HP.");
                }
            }

            this.modEntropy(cost);
            this.updateUI();

            if (this.state.enemy.hp <= 0) {
                this.victory();
            } else {
                setTimeout(() => this.enemyTurn(), 260);
            }
        },

        enemyTurn() {
            if (this.state.phase !== "combat" || this.state.over || !this.state.enemy) return;
            let edmg = this.state.enemy.dmg;
            if (this.state.entropy > 70) edmg = Math.floor(edmg * 1.5);
            this.state.hp -= edmg;
            this.log(this.state.enemy.name + " нанес " + edmg + " урона.", "warn");
            if (this.state.entropy >= 100) {
                this.log("ПЕРЕГРУЗКА ЭНТРОПИИ! -10 HP", "danger");
                this.state.hp -= 10;
                this.state.entropy = 50;
            }
            if (this.state.hp <= 0) {
                this.gameOver();
            }
            this.updateUI();
        },

        victory() {
            this.log("Враг уничтожен.");
            this.state.combat = false;
            this.state.phase = "loot";
            this.state.enemy = null;
            removeEnemyMesh();
            document.getElementById("entity-name").innerText = "СЕКТОР ЗАЧИЩЕН";
            document.getElementById("entity-hp").innerText = "";
            this.generateLoot();
        },

        createItem(lvl, forceType) {
            const isWeapon = forceType ? forceType === "atk" : Math.random() > 0.5;
            const template = isWeapon ? ITEM_TYPES.WEAPON : ITEM_TYPES.UTILITY;
            const prefix = PREFIXES[Math.floor(Math.random() * PREFIXES.length)];
            const nameBase = template.names[Math.floor(Math.random() * template.names.length)];
            const scale = 1 + lvl * 0.3;
            const baseVal = 5 + Math.floor(Math.random() * 5);
            const finalVal = Math.floor(baseVal * scale * prefix.mul);
            return {
                name: prefix.text + " " + nameBase,
                type: template.type,
                val: finalVal,
                desc: isWeapon ? "УРОН: " + finalVal : "ХИЛ: " + finalVal
            };
        },

        generateLoot() {
            this.state.loot = this.createItem(this.state.depth);
            const panel = document.getElementById("loot-panel");
            document.getElementById("loot-desc").innerHTML =
                '<strong style="color:var(--cyan)">' + this.state.loot.name + "</strong><br>" +
                this.state.loot.desc;
            panel.style.display = "block";
            this.updateUI();
        },

        equipLoot(slot) {
            this.state.inventory[slot] = this.state.loot;
            this.closeLoot();
        },

        discardLoot() {
            this.modEntropy(15);
            this.log("Предмет разобран на энергию.", "warn");
            this.closeLoot();
        },

        closeLoot() {
            document.getElementById("loot-panel").style.display = "none";
            this.state.loot = null;
            this.renderInv();
            if (!this.state.over) {
                this.state.phase = "explore";
            }
            this.updateUI();
            placeDoorMesh(this.world.doorPos, !this.state.enemy);
        },

        renderInv() {
            this.state.inventory.forEach((item, idx) => {
                const el = document.getElementById("slot-" + idx);
                el.className = "item-slot";
                if (item) {
                    el.innerHTML = '<span style="color:#fff">' + item.name + "</span><br>" + item.desc;
                    if (item.type === "atk") el.classList.add("slot-weapon");
                    if (item.type === "heal") el.classList.add("slot-utility");
                } else {
                    el.innerHTML = "ПУСТО";
                }
            });
        },

        updateUI() {
            document.getElementById("ui-depth").innerText = this.state.depth;
            document.getElementById("ui-hp").innerText = Math.max(0, this.state.hp);
            document.getElementById("ui-maxhp").innerText = this.state.maxHp;
            const ent = document.getElementById("ui-entropy");
            ent.innerText = this.state.entropy + "%";
            ent.style.color = "hsl(" + (120 - this.state.entropy) + ",100%,50%)";

            if (this.state.enemy && this.state.phase === "combat") {
                document.getElementById("entity-hp").innerText =
                    "HP: " + this.state.enemy.hp + " / " + this.state.enemy.maxHp;
            }

            const inCombat = this.state.phase === "combat";
            ["btn-atk", "btn-heal", "btn-glitch"].forEach(id => {
                const b = document.getElementById(id);
                b.disabled = !inCombat || this.state.over;
            });
        },

        modEntropy(val) {
            this.state.entropy = Math.max(0, Math.min(100, this.state.entropy + val));
        },

        log(msg, type) {
            const div = document.createElement("div");
            div.innerText = "> " + msg;
            if (type) div.classList.add(type);
            const box = document.getElementById("combat-log");
            box.prepend(div);
            if (box.children.length > 40) box.lastChild.remove();
        },

        gameOver() {
            this.state.over = true;
            this.state.combat = false;
            this.state.phase = "dead";
            this.log("СИСТЕМА ОТКЛЮЧЕНА.", "danger");
            document.getElementById("main-menu").style.display = "flex";
            document.getElementById("menu-title").innerText = "GAME OVER";
            document.getElementById("start-btn").innerText = "ПЕРЕЗАПУСК";
        }
    };

    function init3D() {
        const container = document.getElementById("three-container");
        const width = container.clientWidth || 600;
        const height = container.clientHeight || 360;

        renderer = new THREE.WebGLRenderer({antialias: true, alpha: true});
        renderer.setSize(width, height);
        renderer.setPixelRatio(window.devicePixelRatio || 1);
        container.innerHTML = "";
        container.appendChild(renderer.domElement);

        scene = new THREE.Scene();

        camera = new THREE.PerspectiveCamera(55, width / height, 0.1, 100);
        camera.position.set(8, 12, 12);

        const ambient = new THREE.AmbientLight(0x00ffcc, 0.45);
        const mainLight = new THREE.DirectionalLight(0xffffff, 1.1);
        mainLight.position.set(6, 10, 4);
        const backLight = new THREE.PointLight(0x00ffff, 0.6, 40);
        backLight.position.set(-6, 5, -5);
        scene.add(ambient);
        scene.add(mainLight);
        scene.add(backLight);

        const playerGeom = new THREE.BoxGeometry(0.8, 1.2, 0.8);
        const playerMat = new THREE.MeshStandardMaterial({
            color: 0x00ff66,
            metalness: 0.3,
            roughness: 0.35,
            emissive: 0x00ff66,
            emissiveIntensity: 0.5
        });
        playerMesh = new THREE.Mesh(playerGeom, playerMat);
        playerMesh.position.set(0, 0.6, 0);
        scene.add(playerMesh);

        roomGroup = new THREE.Group();
        scene.add(roomGroup);

        window.addEventListener("resize", onWindowResize);
        lastTime = performance.now();
        requestAnimationFrame(loop3D);
    }

    function rebuildRoom(size) {
        if (!scene) return;
        if (roomGroup) {
            scene.remove(roomGroup);
        }
        roomGroup = new THREE.Group();
        scene.add(roomGroup);

        const floorGeom = new THREE.PlaneGeometry(size, size);
        const floorMat = new THREE.MeshStandardMaterial({
            color: 0x020806,
            metalness: 0.2,
            roughness: 0.9
        });
        const floor = new THREE.Mesh(floorGeom, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = 0;
        roomGroup.add(floor);

        const wallHeight = 3;
        const wallThickness = 0.4;

        const wallMat = new THREE.MeshStandardMaterial({
            color: 0x041010,
            metalness: 0.3,
            roughness: 0.6,
            emissive: 0x003322,
            emissiveIntensity: 0.3
        });

        const wallGeomH = new THREE.BoxGeometry(size, wallHeight, wallThickness);
        const wallGeomV = new THREE.BoxGeometry(wallThickness, wallHeight, size);

        const northWallLeft = new THREE.Mesh(wallGeomH, wallMat);
        northWallLeft.position.set(-size * 0.35, wallHeight / 2, -size / 2);
        roomGroup.add(northWallLeft);

        const northWallRight = new THREE.Mesh(wallGeomH, wallMat);
        northWallRight.position.set(size * 0.35, wallHeight / 2, -size / 2);
        roomGroup.add(northWallRight);

        const southWall = new THREE.Mesh(wallGeomH, wallMat);
        southWall.position.set(0, wallHeight / 2, size / 2);
        roomGroup.add(southWall);

        const westWall = new THREE.Mesh(wallGeomV, wallMat);
        westWall.position.set(-size / 2, wallHeight / 2, 0);
        roomGroup.add(westWall);

        const eastWall = new THREE.Mesh(wallGeomV, wallMat);
        eastWall.position.set(size / 2, wallHeight / 2, 0);
        roomGroup.add(eastWall);
    }

    function placePlayerMesh(pos) {
        if (!playerMesh) return;
        playerMesh.position.set(pos.x, 0.6, pos.z);
    }

    function spawnEnemyMesh(enemy, pos) {
        if (!scene) return;
        removeEnemyMesh();
        if (!enemy) return;

        const colorHex = parseInt(enemy.color.replace("#", "0x"), 16);
        const group = new THREE.Group();

        if (enemy.name === "BLOCK_WALL") {
            const geom = new THREE.BoxGeometry(2.2, 2.2, 2.2);
            const mat = new THREE.MeshStandardMaterial({
                color: colorHex,
                metalness: 0.7,
                roughness: 0.2,
                emissive: colorHex,
                emissiveIntensity: 0.3
            });
            const cube = new THREE.Mesh(geom, mat);
            group.add(cube);

            const edgeGeom = new THREE.EdgesGeometry(geom);
            const edgeMat = new THREE.LineBasicMaterial({color: 0xffffff});
            const edges = new THREE.LineSegments(edgeGeom, edgeMat);
            group.add(edges);
        } else if (enemy.name === "NULL_DRONE") {
            const coreGeom = new THREE.SphereGeometry(0.9, 32, 32);
            const coreMat = new THREE.MeshStandardMaterial({
                color: colorHex,
                metalness: 0.4,
                roughness: 0.25,
                emissive: colorHex,
                emissiveIntensity: 0.6,
                transparent: true,
                opacity: 0.95
            });
            const core = new THREE.Mesh(coreGeom, coreMat);
            group.add(core);

            const shellGeom = new THREE.SphereGeometry(1.6, 32, 32);
            const shellMat = new THREE.MeshStandardMaterial({
                color: colorHex,
                wireframe: true,
                emissive: colorHex,
                emissiveIntensity: 0.3
            });
            const shell = new THREE.Mesh(shellGeom, shellMat);
            group.add(shell);

            const torusGeom = new THREE.TorusGeometry(2.3, 0.08, 12, 64);
            const torusMat = new THREE.MeshBasicMaterial({color: 0xffffff});
            const torus = new THREE.Mesh(torusGeom, torusMat);
            torus.rotation.x = Math.PI / 3;
            group.add(torus);
        } else if (enemy.name === "TROJAN_VIRUS") {
            const bodyGeom = new THREE.IcosahedronGeometry(1.3, 1);
            const bodyMat = new THREE.MeshStandardMaterial({
                color: colorHex,
                metalness: 0.85,
                roughness: 0.2,
                emissive: colorHex,
                emissiveIntensity: 0.6
            });
            const body = new THREE.Mesh(bodyGeom, bodyMat);
            group.add(body);

            const spikeGeom = new THREE.ConeGeometry(0.2, 0.7, 6);
            const spikeMat = new THREE.MeshStandardMaterial({
                color: 0xffffff,
                emissive: 0xff0000,
                emissiveIntensity: 0.7
            });
            const positions = [
                new THREE.Vector3(1.7, 0, 0),
                new THREE.Vector3(-1.7, 0, 0),
                new THREE.Vector3(0, 1.7, 0),
                new THREE.Vector3(0, -1.7, 0),
                new THREE.Vector3(0, 0, 1.7),
                new THREE.Vector3(0, 0, -1.7)
            ];
            positions.forEach(p => {
                const spike = new THREE.Mesh(spikeGeom, spikeMat);
                spike.position.copy(p);
                spike.lookAt(0, 0, 0);
                group.add(spike);
            });
        } else {
            const geom = new THREE.SphereGeometry(1.3, 32, 32);
            const mat = new THREE.MeshStandardMaterial({
                color: colorHex,
                metalness: 0.5,
                roughness: 0.3,
                emissive: colorHex,
                emissiveIntensity: 0.4
            });
            const mesh = new THREE.Mesh(geom, mat);
            group.add(mesh);
        }

        group.position.set(pos.x, 1.2, pos.z);
        enemyMesh = group;
        scene.add(enemyMesh);
    }

    function removeEnemyMesh() {
        if (!enemyMesh || !scene) return;
        scene.remove(enemyMesh);
        enemyMesh = null;
    }

    function placeDoorMesh(pos, unlocked) {
        if (!scene) return;
        if (doorMesh) scene.remove(doorMesh);
        const doorGeom = new THREE.BoxGeometry(2, 2.8, 0.35);
        const color = unlocked ? 0xffcc00 : 0x222233;
        const emissive = unlocked ? 0xffcc00 : 0x003311;
        const mat = new THREE.MeshStandardMaterial({
            color: color,
            metalness: 0.6,
            roughness: 0.3,
            emissive: emissive,
            emissiveIntensity: unlocked ? 0.8 : 0.3
        });
        doorMesh = new THREE.Mesh(doorGeom, mat);
        doorMesh.position.set(pos.x, 1.4, pos.z);
        scene.add(doorMesh);
    }

    function loop3D(time) {
        requestAnimationFrame(loop3D);
        if (!renderer || !scene || !camera) return;
        const dt = (time - lastTime) / 1000;
        lastTime = time;
        update3D(dt);
        renderer.render(scene, camera);
    }

    function update3D(dt) {
        if (!playerMesh) return;
        const lootVisible = document.getElementById("loot-panel").style.display === "block";
        if (Game.state.phase === "explore" && !Game.state.over && !lootVisible) {
            handleMovement(dt);
        }
        if (enemyMesh) {
            enemyMesh.rotation.y += dt * 0.8;
        }
        updateCamera();
    }

    function handleMovement(dt) {
        const speed = 4;
        let vx = 0;
        let vz = 0;
        if (keys["KeyW"]) vz -= 1;
        if (keys["KeyS"]) vz += 1;
        if (keys["KeyA"]) vx -= 1;
        if (keys["KeyD"]) vx += 1;
        if (vx !== 0 || vz !== 0) {
            const len = Math.hypot(vx, vz);
            if (len > 0) {
                vx /= len;
                vz /= len;
            }
            const pos = Game.world.playerPos;
            pos.x += vx * speed * dt;
            pos.z += vz * speed * dt;
            const half = Game.world.roomSize / 2 - 1;
            pos.x = Math.max(-half, Math.min(half, pos.x));
            pos.z = Math.max(-half, Math.min(half, pos.z));
            playerMesh.position.x = pos.x;
            playerMesh.position.z = pos.z;
        }

        if (enemyMesh && Game.state.enemy && Game.state.phase === "explore") {
            const dx = Game.world.playerPos.x - enemyMesh.position.x;
            const dz = Game.world.playerPos.z - enemyMesh.position.z;
            const dist = Math.hypot(dx, dz);
            if (dist < 1.6) {
                Game.startCombat();
            }
        }

        if (Game.world.doorPos && Game.state.phase === "explore") {
            const dx = Game.world.playerPos.x - Game.world.doorPos.x;
            const dz = Game.world.playerPos.z - Game.world.doorPos.z;
            const dist = Math.hypot(dx, dz);
            if (dist < 1.6) {
                Game.hitDoor();
            }
        }
    }

    function updateCamera() {
        const pos = Game.world.playerPos;
        const offset = {x: 7, y: 9, z: 7};
        camera.position.x = pos.x + offset.x;
        camera.position.y = offset.y;
        camera.position.z = pos.z + offset.z;
        camera.lookAt(playerMesh.position);
    }

    function animEnemyHit() {
        if (!enemyMesh) return;
        const originalScale = enemyMesh.scale.clone();
        enemyMesh.scale.set(originalScale.x * 1.15, originalScale.y * 1.15, originalScale.z * 1.15);
        setTimeout(() => {
            if (enemyMesh) enemyMesh.scale.copy(originalScale);
        }, 120);
    }

    function onWindowResize() {
        if (!renderer || !camera) return;
        const container = document.getElementById("three-container");
        const width = container.clientWidth || 600;
        const height = container.clientHeight || 360;
        camera.aspect = width / height;
        camera.updateProjectionMatrix();
        renderer.setSize(width, height);
    }

    window.addEventListener("load", () => {
        init3D();

        document.getElementById("start-btn").addEventListener("click", () => Game.start());

        window.addEventListener("keydown", e => {
            if (e.code === "KeyW" || e.code === "KeyA" || e.code === "KeyS" || e.code === "KeyD") {
                keys[e.code] = true;
                e.preventDefault();
            }
        });

        window.addEventListener("keyup", e => {
            if (keys[e.code]) {
                delete keys[e.code];
                e.preventDefault();
            }
        });
    });
</script>
</body>
</html>
